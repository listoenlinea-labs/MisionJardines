<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Vincular WhatsApp | Misión Jardines</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7f4;color:#19392d;padding:24px}
main{background:white;border:1px solid #d9e7df;border-radius:18px;max-width:460px;margin:6vh auto;padding:28px;box-shadow:0 9px 30px #1232}
h1{font-size:23px}p{line-height:1.6;color:#475d52}
label{font-weight:600;display:block;margin:16px 0 5px}
input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font:inherit}
input,select{border:1px solid #9cb7a6}button{margin-top:20px;background:#216c49;color:white;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}#message{min-height:24px}a{color:#216c49}</style>
<script src="/js/whatsapp-vincular.js" defer></script></head>
<body><main><h1>🌿 Misión Jardines</h1><p>Vincula tu cuenta para realizar trámites privados por WhatsApp. Tu contraseña solo se escribe en esta página HTTPS, nunca en el chat.</p>
<form id="login"><label for="correo">Correo de tu usuario</label><input id="correo" type="email" autocomplete="username" required maxlength="150">
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="entrar" type="submit">Iniciar sesión de forma segura</button></form>
<form id="vivienda" hidden><label for="casa">Selecciona tu vivienda autorizada</label><select id="casa" required></select>
<button id="vincular" type="submit">Vincular con WhatsApp</button></form>
<p id="message" role="status" aria-live="polite"></p>
<p><small>El enlace vence a los 10 minutos y solo se puede usar una vez. La vinculación dura 24 horas y se invalida al revocar tu acceso.</small></p></main></body></html>
