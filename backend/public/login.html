<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso | Misión Jardines</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#1b2a3d;font-family:Inter,Segoe UI,Arial,sans-serif}
.card{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid #e1e6ed;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(20,40,60,.1)}
h1{margin:0 0 8px;font-size:30px;letter-spacing:-.04em}p{margin:0 0 22px;color:#708096;font-size:13px;line-height:1.55}
label{display:block;margin:14px 0 6px;font-size:11px;font-weight:800;color:#516078}
input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #dce3ec;border-radius:11px;font:inherit;outline:none}
input:focus{border-color:#e9913b;box-shadow:0 0 0 4px rgba(233,145,59,.11)}
button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:11px;background:#e9780d;color:#fff;font-weight:850;cursor:pointer}
.msg{min-height:20px;margin-top:12px;color:#b34343;font-size:12px}
</style>
</head>
<body>
<form class="card" id="loginForm">
  <h1>Misión Jardines</h1>
  <p>Acceso temporal desde Hostinger mientras GitHub Pages termina de publicar la versión nueva.</p>
  <label>Correo</label>
  <input id="correo" type="email" autocomplete="username" required>
  <label>Contraseña</label>
  <input id="contrasena" type="password" autocomplete="current-password" required>
  <button type="submit">Iniciar sesión</button>
  <div id="msg" class="msg"></div>
</form>
<script>
const API='/api';
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'); msg.textContent='Ingresando…';
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:correo.value.trim(),contrasena:contrasena.value})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw Error(d.message||'No fue posible iniciar sesión');
    localStorage.setItem('misionJardinesToken',d.token);
    localStorage.setItem('misionJardinesUsuario',JSON.stringify(d.usuario));
    location.replace('conmutador.html');
  }catch(err){msg.textContent=err.message}
});
</script>
</body>
</html>
