<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f97316">
  <title>Inicio | Misión Jardines</title>
  <script>
    window.MJ_API_URL = 'https://api-misionjardines.listoenlinea.host/api';
    window.MJ_TOKEN = localStorage.getItem('misionJardinesToken') || sessionStorage.getItem('misionJardinesToken');
    if (!window.MJ_TOKEN) window.location.replace('login.html');
  </script>
  <style>
    :root {
      --ink: #172033;
      --muted: #69758d;
      --line: #e4e8ef;
      --soft: #f7f8fa;
      --orange: #f97316;
      --orange-dark: #e96208;
      --green: #079455;
      --red: #f04438;
      --blue: #3478df;
      --sidebar: 224px;
      --topbar: 72px;
      --shadow: 0 8px 24px rgba(15, 23, 42, .055);
    }

    * { box-sizing: border-box; }

    html { background: #fff; }

    body.mj-home {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #fff;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    [hidden] { display: none !important; }

    .mj-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      transition: grid-template-columns .24s ease;
    }

    .mj-home.sidebar-hidden .mj-shell { grid-template-columns: 0 minmax(0, 1fr); }

    .mj-sidebar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: #fff;
      transition: transform .24s ease;
    }

    .mj-home.sidebar-hidden .mj-sidebar { transform: translateX(-100%); }

    .sidebar-inner {
      width: var(--sidebar);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 23px 15px 16px;
    }

    .sidebar-logo {
      height: 67px;
      display: grid;
      place-items: center;
    }

    .sidebar-logo img {
      width: 111px;
      height: 46px;
      object-fit: contain;
    }

    .community-name {
      padding: 15px 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .community-name strong {
      display: block;
      font-size: 15px;
      line-height: 1.35;
    }

    .community-name span {
      display: block;
      margin-top: 2px;
      color: #8b95a7;
      font-size: 12px;
    }

    .sidebar-nav {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 15px 0 8px;
      scrollbar-width: thin;
    }

    .nav-group { margin: 0 0 15px; }

    .nav-label {
      padding: 0 13px 7px;
      color: #8994a8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .nav-link {
      position: relative;
      height: 35px;
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 1px 0;
      padding: 0 13px;
      border-radius: 7px;
      color: #5f6b81;
      font-size: 13px;
      transition: background .16s ease, color .16s ease;
    }

    .nav-link:hover { color: var(--orange); background: #fff8f2; }

    .nav-link.active {
      color: var(--orange);
      font-weight: 700;
      background: #fff5ec;
    }

    .nav-link.active::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -1px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--orange);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .support-card {
      flex: 0 0 auto;
      margin: 3px 1px 0;
      padding: 15px 14px 12px;
      border: 1px solid #f0e8df;
      border-radius: 13px;
      background: linear-gradient(145deg, #fffaf6, #fff);
      box-shadow: 0 8px 24px rgba(249,115,22,.06);
      text-align: center;
    }

    .support-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .support-head svg { color: var(--orange); }
    .support-card p { margin: 6px 0 9px; color: var(--muted); font-size: 10px; line-height: 1.55; }

    .support-button {
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #fff;
      background: var(--orange);
      font-size: 10px;
      font-weight: 800;
    }

    .sidebar-bottom {
      height: 28px;
      display: grid;
      place-items: end center;
      color: #7f8ba0;
    }

    .mj-app { min-width: 0; background: #fff; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--topbar);
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px 0 35px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { background: var(--soft); }

    .search {
      width: min(483px, 40vw);
      height: 42px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px 0 14px;
      border: 1px solid #dfe4ec;
      border-radius: 11px;
      box-shadow: 0 2px 7px rgba(15,23,42,.025);
    }

    .search svg { color: #98a2b3; flex: 0 0 auto; }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
    }

    .search input::placeholder { color: #7d879a; }

    .shortcut {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #99a2b1;
      background: #fafbfc;
      font-size: 10px;
    }

    .topbar-spacer { flex: 1; }

    .operation-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid #dfeee5;
      border-radius: 999px;
      color: #14763f;
      background: #f1faf5;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .operation-status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #12b76a;
      box-shadow: 0 0 0 4px rgba(18,183,106,.1);
    }

    .notification-wrap, .profile-wrap { position: relative; }

    .notification-button { position: relative; }
    .notification-badge {
      position: absolute;
      top: 1px;
      right: 0;
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: #e33b3b;
      font-size: 9px;
      font-weight: 800;
    }

    .profile-button {
      min-width: 190px;
      height: 51px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 4px 0 13px;
      border: 0;
      border-left: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      text-align: left;
    }

    .avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      font-size: 12px;
      font-weight: 700;
    }

    .profile-copy { min-width: 0; flex: 1; }
    .profile-copy strong, .profile-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-copy strong { font-size: 11px; }
    .profile-copy span { margin-top: 3px; color: var(--muted); font-size: 10px; }

    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 50;
      width: 250px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 20px 45px rgba(15,23,42,.14);
    }

    .notification-dropdown { width: 330px; padding: 5px 0; }
    .dropdown-title { padding: 11px 15px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 800; }

    .notice-mini {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 15px;
      border-bottom: 1px solid #f0f2f5;
    }

    .notice-mini:last-child { border-bottom: 0; }
    .notice-mini i { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--orange); }
    .notice-mini strong { display: block; font-size: 11px; }
    .notice-mini span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.45; }

    .logout-button {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 8px;
      color: #c4322d;
      background: #fff4f3;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }

    .dashboard {
      width: 100%;
      max-width: 1510px;
      margin: 0 auto;
      padding: 24px 36px 0;
    }

    .welcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 79px;
      padding-bottom: 18px;
    }

    .welcome-copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(25px, 2vw, 33px);
      line-height: 1.1;
      letter-spacing: -.045em;
    }

    .welcome-copy p { margin: 8px 0 0; color: #748097; font-size: 13px; }

    .quick-actions { display: flex; align-items: center; gap: 17px; }

    .action-button {
      height: 45px;
      min-width: 182px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 21px;
      border: 1px solid #e3e7ed;
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 5px 14px rgba(15,23,42,.035);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .action-button:hover { border-color: #f4b98d; transform: translateY(-1px); }

    .action-button.primary {
      border-color: var(--orange);
      color: #fff;
      background: linear-gradient(135deg, #fb7b1a, #ed650a);
      box-shadow: 0 10px 22px rgba(249,115,22,.22);
    }

    .action-button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 17px;
      margin-bottom: 16px;
    }

    .card {
      border: 1px solid #dfe3e9;
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .kpi-card {
      min-width: 0;
      height: 118px;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) 75px;
      align-items: center;
      gap: 16px;
      padding: 20px 20px;
    }

    .kpi-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 13px;
    }

    .kpi-icon svg { width: 29px; height: 29px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .kpi-icon.green { color: #078944; background: #edf8f1; }
    .kpi-icon.orange { color: #f97316; background: #fff4ea; }
    .kpi-icon.red { color: #f04438; background: #fff0f0; }
    .kpi-icon.blue { color: #3478df; background: #eef5ff; }

    .kpi-copy { min-width: 0; }
    .kpi-copy span { display: block; color: #5f6b81; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .kpi-copy strong { display: block; margin: 6px 0 4px; font-size: 23px; line-height: 1; }
    .kpi-copy small { display: block; color: #7c8799; font-size: 10px; white-space: nowrap; }
    .kpi-copy small.positive { color: #08924d; }
    .kpi-copy small b { margin-right: 3px; font-size: 12px; }
    .sparkline { width: 75px; height: 43px; overflow: visible; }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.53fr) minmax(330px, 1fr) 340px;
      gap: 15px;
      margin-bottom: 16px;
    }

    .panel-head {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 0 20px;
    }

    .panel-head h2 { margin: 0; font-size: 13px; }

    .select-button {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #4c576b;
      background: #fff;
      font-size: 10px;
      cursor: pointer;
    }

    .map-panel, .collection-panel { height: 416px; overflow: hidden; }

    .community-map {
      position: relative;
      height: 300px;
      margin: 0 19px;
      overflow: hidden;
      border-radius: 9px;
      background: #eef1f2;
    }

    .community-map > svg { width: 100%; height: 100%; }

    .map-controls {
      position: absolute;
      left: 10px;
      bottom: 9px;
      display: grid;
      gap: 1px;
      overflow: hidden;
      border: 1px solid #dfe4e8;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(15,23,42,.1);
    }

    .map-controls button {
      width: 29px;
      height: 29px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid #eef0f2;
      color: #5d687a;
      background: #fff;
      cursor: pointer;
      font-size: 17px;
    }

    .map-controls button:last-child { border-bottom: 0; font-size: 12px; }

    .map-marker {
      position: absolute;
      width: 33px;
      height: 33px;
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      border-radius: 50%;
      color: #087d43;
      background: #eaf8ef;
      box-shadow: 0 4px 11px rgba(15,23,42,.18);
    }

    .map-marker svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .map-marker.m1 { left: 60%; top: 10%; }
    .map-marker.m2 { left: 18%; top: 43%; }
    .map-marker.m3 { right: 8%; top: 56%; }
    .map-marker.alert { left: 63%; top: 67%; color: #fff; background: var(--orange); font-size: 17px; font-weight: 900; }
    .map-marker.shield { left: 60%; top: 48%; color: #3478df; background: #edf5ff; }
    .map-point { position: absolute; left: 37%; bottom: 13%; width: 14px; height: 14px; border: 3px solid #fff; border-radius: 50%; background: #4a83db; box-shadow: 0 2px 7px rgba(15,23,42,.22); }

    .map-legend {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 36px;
      color: #69758a;
      font-size: 10px;
      white-space: nowrap;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .collection-body { padding: 0 20px 15px; }
    .collection-total { color: #728096; font-size: 10px; }
    .collection-amount { display: flex; align-items: baseline; gap: 15px; margin-top: 5px; }
    .collection-amount strong { font-size: 21px; }
    .collection-amount span { color: #088b4a; font-size: 10px; }
    .chart { width: 100%; height: 260px; margin-top: 10px; overflow: visible; }
    .chart-legend { display: flex; align-items: center; justify-content: center; gap: 50px; color: #6d788b; font-size: 10px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .chart-legend i { width: 17px; height: 0; border-top: 2px solid #b7bec8; }
    .chart-legend .current i { border-color: var(--orange); }

    .right-stack { display: grid; grid-template-rows: 318px 98px; gap: 15px; }
    .activity-panel { overflow: hidden; }
    .activity-link { color: var(--orange); font-size: 10px; font-weight: 800; }
    .activity-list { padding: 0 17px 7px; }

    .activity-row {
      height: 49px;
      display: grid;
      grid-template-columns: 8px 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .activity-row > i { width: 7px; height: 7px; border-radius: 50%; }
    .activity-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
    .activity-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .activity-copy { min-width: 0; }
    .activity-copy strong, .activity-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-copy strong { font-size: 10px; }
    .activity-copy span { margin-top: 3px; color: #69758a; font-size: 9px; }
    .activity-time { color: #69758a; font-size: 8px; white-space: nowrap; }

    .event-panel { padding: 14px 19px; }
    .event-panel h2 { margin: 0 0 10px; font-size: 12px; }
    .event-content { display: flex; align-items: center; gap: 13px; }
    .event-icon { width: 49px; height: 49px; display: grid; place-items: center; flex: 0 0 49px; border-radius: 10px; color: var(--orange); background: #fff4ea; }
    .event-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .event-copy { min-width: 0; }
    .event-copy strong { display: block; font-size: 10px; }
    .event-copy span { display: block; margin-top: 2px; color: #69758a; font-size: 8px; line-height: 1.35; white-space: nowrap; }

    .bottom-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(430px, 1.24fr) 340px;
      gap: 15px;
    }

    .important-card {
      min-height: 111px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 21px;
      border-color: #f3dcc9;
      background: #fffdfb;
    }

    .important-icon { width: 56px; height: 56px; display: grid; place-items: center; flex: 0 0 56px; border-radius: 12px; color: var(--orange); background: #fff3e7; }
    .important-icon svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .important-copy { min-width: 0; flex: 1; }
    .important-copy strong { display: block; font-size: 12px; }
    .important-copy p { margin: 5px 0; color: #66738a; font-size: 10px; line-height: 1.45; }
    .important-copy a { color: var(--orange); font-size: 10px; font-weight: 800; }
    .dismiss { align-self: flex-start; padding: 0; border: 0; color: #98a2b3; background: transparent; cursor: pointer; font-size: 18px; }

    .summary-card {
      min-height: 111px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      padding: 13px 12px;
    }

    .summary-item { min-width: 0; display: grid; grid-template-columns: 46px minmax(0,1fr); align-items: center; gap: 10px; padding: 0 8px; }
    .summary-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; }
    .summary-icon svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .summary-copy { min-width: 0; }
    .summary-copy span { display: block; color: #768197; font-size: 8px; white-space: nowrap; }
    .summary-copy strong { display: block; margin: 4px 0 3px; font-size: 16px; white-space: nowrap; }
    .summary-copy small { display: block; color: #677388; font-size: 8px; white-space: nowrap; }

    .details-card { min-height: 111px; display: flex; align-items: center; padding: 18px 20px; }
    .details-button { height: 35px; display: inline-flex; align-items: center; padding: 0 15px; border: 1px solid #e3e7ec; border-radius: 7px; color: var(--orange); background: #fff; font-size: 10px; font-weight: 800; }

    .page-footer {
      min-height: 70px;
      display: grid;
      place-items: center;
      padding: 18px 0 14px;
      color: #778399;
      text-align: center;
      font-size: 10px;
      line-height: 1.8;
    }

    .page-footer span { display: block; }

    @media (max-width: 1370px) {
      :root { --sidebar: 212px; }
      .dashboard { padding-inline: 24px; }
      .main-grid { grid-template-columns: minmax(0, 1.25fr) minmax(310px, .9fr); }
      .right-stack { grid-column: 1 / -1; grid-template-columns: 1.4fr 1fr; grid-template-rows: 150px; }
      .activity-panel { height: 150px; }
      .activity-list { display: grid; grid-template-columns: repeat(2, 1fr); }
      .panel-head { height: 47px; }
      .activity-row { height: 43px; }
      .event-panel { height: 150px; }
      .bottom-grid { grid-template-columns: 1.2fr 1fr; }
      .details-card { display: none; }
    }

    @media (max-width: 1080px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main-grid { grid-template-columns: 1fr; }
      .map-panel, .collection-panel { height: auto; }
      .bottom-grid { grid-template-columns: 1fr; }
      .quick-actions .action-button:not(.primary) { display: none; }
    }

    @media (max-width: 820px) {
      :root { --sidebar: min(280px, calc(100vw - 55px)); --topbar: 62px; }
      .mj-shell { display: block; }
      .mj-sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); transform: translateX(-100%); box-shadow: 20px 0 50px rgba(15,23,42,.18); }
      .mj-home.mobile-menu-open .mj-sidebar { transform: translateX(0); }
      .mj-home.mobile-menu-open::after { content: ""; position: fixed; inset: 0; z-index: 35; background: rgba(15,23,42,.34); }
      .topbar { padding: 0 12px; gap: 6px; }
      .search { width: auto; flex: 1; }
      .shortcut, .operation-status, .profile-copy { display: none; }
      .profile-button { min-width: 45px; width: 45px; padding: 0; border-left: 0; }
      .avatar { width: 34px; height: 34px; flex-basis: 34px; }
      .dashboard { padding: 18px 14px 0; }
      .welcome-row { align-items: flex-start; min-height: 95px; }
      .welcome-copy h1 { font-size: 24px; }
      .action-button.primary { min-width: 44px; width: 44px; padding: 0; font-size: 0; }
      .kpi-grid { gap: 10px; }
      .kpi-card { height: 100px; grid-template-columns: 48px 1fr; gap: 11px; padding: 14px; }
      .kpi-icon { width: 48px; height: 48px; }
      .sparkline { display: none; }
      .kpi-copy strong { font-size: 20px; }
      .right-stack { grid-template-columns: 1fr; grid-template-rows: auto; }
      .activity-panel, .event-panel { height: auto; }
      .activity-list { display: block; }
      .summary-card { grid-template-columns: 1fr; gap: 12px; }
      .summary-item { border-bottom: 1px solid #edf0f3; padding-bottom: 10px; }
      .summary-item:last-child { border-bottom: 0; padding-bottom: 0; }
    }

    @media (max-width: 540px) {
      .search input::placeholder { color: transparent; }
      .search { max-width: 145px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .community-map { height: 260px; margin-inline: 12px; }
      .map-legend { gap: 10px; padding-inline: 16px; overflow-x: auto; }
      .chart { height: 230px; }
      .important-card { align-items: flex-start; }
    }
  </style>
</head>
<body class="mj-home">
  <div class="mj-shell">
    <aside class="mj-sidebar" id="sidebar" aria-label="Navegación principal"></aside>

    <div class="mj-app">
      <header class="topbar">
        <button class="icon-button" id="menuButton" type="button" aria-label="Ocultar o mostrar menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <form class="search" id="searchForm"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="globalSearch" type="search" placeholder="Buscar residentes, casas, visitas, reportes..." aria-label="Buscar"><span class="shortcut">⌘ K</span></form>
        <div class="topbar-spacer"></div>
        <div class="operation-status"><i></i>Consultando datos</div>
        <div class="notification-wrap">
          <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notificaciones"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg><span class="notification-badge" hidden></span></button>
          <div class="dropdown notification-dropdown" id="notificationMenu" hidden><div class="dropdown-title">Próximos eventos</div><div class="notice-mini">Consultando agenda…</div></div>
        </div>
        <div class="profile-wrap">
          <button class="profile-button" id="profileButton" type="button"><span class="avatar js-initials">MJ</span><span class="profile-copy"><strong class="js-fullname">Mi cuenta</strong><span class="js-role">Usuario</span></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg></button>
          <div class="dropdown" id="profileMenu" hidden><button class="logout-button" id="logoutButton" type="button">Cerrar sesión</button></div>
        </div>
      </header>

      <main class="dashboard"><div style="padding:32px;color:#69778d">Consultando datos del fraccionamiento…</div></main>
    </div>
  </div>

  <script>
    const token = window.MJ_TOKEN;
    const body = document.body;
    const menuButton = document.getElementById('menuButton');
    const notificationButton = document.getElementById('notificationButton');
    const notificationMenu = document.getElementById('notificationMenu');
    const profileButton = document.getElementById('profileButton');
    const profileMenu = document.getElementById('profileMenu');

    function closeDropdowns(except) {
      if (except !== notificationMenu) notificationMenu.hidden = true;
      if (except !== profileMenu) profileMenu.hidden = true;
    }

    menuButton.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 820px)').matches) body.classList.toggle('mobile-menu-open');
      else body.classList.toggle('sidebar-hidden');
    });

    document.getElementById('sidebar').addEventListener('click', (event) => {
      if (window.matchMedia('(max-width: 820px)').matches && event.target.closest('a')) body.classList.remove('mobile-menu-open');
    });

    notificationButton.addEventListener('click', (event) => { event.stopPropagation(); const opening = notificationMenu.hidden; closeDropdowns(notificationMenu); notificationMenu.hidden = !opening; });
    profileButton.addEventListener('click', (event) => { event.stopPropagation(); const opening = profileMenu.hidden; closeDropdowns(profileMenu); profileMenu.hidden = !opening; });
    document.addEventListener('click', () => closeDropdowns());

    document.getElementById('logoutButton').addEventListener('click', () => {
      ['misionJardinesToken', 'misionJardinesUsuario'].forEach((key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); });
      window.location.replace('login.html');
    });

    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); document.getElementById('globalSearch').focus(); }
      if (event.key === 'Escape') { body.classList.remove('mobile-menu-open'); closeDropdowns(); }
    });

    function getCachedUser() {
      for (const storage of [localStorage, sessionStorage]) {
        try { const raw = storage.getItem('misionJardinesUsuario'); if (raw) return JSON.parse(raw); } catch (_) {}
      }
      return null;
    }

    function displayName(user) {
      return user?.nombreCompleto || user?.nombre_completo || [user?.nombre, user?.apellidoPaterno || user?.apellido_paterno].filter(Boolean).join(' ') || user?.nombre || user?.email?.split('@')[0] || 'Mi cuenta';
    }

    function displayRole(user) {
      const raw = user?.rol?.nombre || user?.rol || 'Administrador';
      return String(raw).toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function applyUser(user) {
      const name = displayName(user);
      const first = name.trim().split(/\s+/)[0] || 'Vladimir';
      const initials = name.trim().split(/\s+/).slice(0, 2).map((part) => part[0]).join('').toUpperCase() || 'VR';
      document.querySelectorAll('.js-fullname').forEach((el) => el.textContent = name);
      document.querySelectorAll('.js-firstname').forEach((el) => el.textContent = first);
      document.querySelectorAll('.js-initials').forEach((el) => el.textContent = initials);
      document.querySelectorAll('.js-role').forEach((el) => el.textContent = displayRole(user));
      applyPermissions(user?.rol?.nombre || user?.rol);
    }

    function applyPermissions(role) {
      if (!role) return;
      document.querySelectorAll('[data-roles]').forEach((element) => {
        const allowed = element.dataset.roles.split(',').map((item) => item.trim());
        element.hidden = !allowed.includes(role);
      });
    }

    async function validateSession() {
      const cached = getCachedUser();
      if (cached) applyUser(cached);
      try {
        const response = await fetch(`${window.MJ_API_URL}/auth/perfil`, { headers: { Authorization: `Bearer ${token}` } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || 'Sesión inválida');
        applyUser(result.usuario);
      } catch (_) {
        ['misionJardinesToken', 'misionJardinesUsuario'].forEach((key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); });
        window.location.replace('login.html');
      }
    }

    validateSession();
  </script>
  <script src="assets/js/site-sidebar.js?v=1"></script>
</body>
</html>
