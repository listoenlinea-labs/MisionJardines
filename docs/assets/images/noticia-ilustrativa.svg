<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
<title id="title">Fondo ilustrativo para noticia sin fotografía</title>
<desc id="desc">Ilustración geométrica abstracta de una ciudad en azul petróleo, violeta y verde salvia; no representa una noticia real.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172945"/><stop offset=".55" stop-color="#354e65"/><stop offset="1" stop-color="#5d557a"/></linearGradient>
  <linearGradient id="horizon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2b515e" stop-opacity=".85"/><stop offset="1" stop-color="#7fa499" stop-opacity=".42"/></linearGradient>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#dce1f0" stroke-opacity=".07"/></pattern>
</defs>
<rect width="880" height="520" fill="url(#sky)"/><rect width="880" height="520" fill="url(#grid)"/>
<circle cx="728" cy="125" r="132" fill="#d9c4fd" opacity=".14"/><circle cx="728" cy="125" r="92" fill="none" stroke="#e8d9fb" stroke-width="2" opacity=".21"/>
