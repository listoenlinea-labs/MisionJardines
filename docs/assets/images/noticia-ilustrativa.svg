<g fill="#dfe9ee" opacity=".17"><rect x="17" y="350" width="25" height="9" rx="2"/><rect x="176" y="312" width="18" height="9" rx="2"/><rect x="454" y="359" width="28" height="9" rx="2"/><rect x="739" y="339" width="20" height="9" rx="2"/></g>
<rect x="0" y="0" width="880" height="520" fill="url(#sky)" opacity=".12"/>
