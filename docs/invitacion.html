<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Invitación · Misión Jardines</title><link rel="stylesheet" href="assets/css/viviendas.css"></head><body><main style="max-width:650px"><h1>Únete a tu vivienda</h1><p id="house">Verificando invitación…</p><div id="message" class="message" hidden role="status"></div><section class="panel" id="options" hidden><h2>¿Ya tienes cuenta?</h2><p>Utiliza el correo al que llegó la invitación. Tu contraseña y tus otras viviendas se conservarán.</p><a class="button" href="login.html">Iniciar sesión con mi cuenta</a><button id="accept" hidden>Aceptar con la sesión actual</button><h2>Crear mi cuenta</h2><form id="register"><div class="grid"><label>Nombre<input name="nombre" required maxlength="100"></label><label>Apellido paterno<input name="apellidoPaterno" required maxlength="100"></label><label>Apellido materno<input name="apellidoMaterno" maxlength="100"></label><label>Teléfono<input name="telefono" maxlength="25"></label><label>Correo de la invitación<input name="correo" type="email" required maxlength="150"></label><label>Contraseña<input name="contrasena" type="password" required minlength="8" autocomplete="new-password"></label></div><p>Usa al menos 8 caracteres, mayúscula, minúscula y número.</p><button>Enviar código de verificación</button></form><form id="verify" hidden><label>Código recibido por correo<input name="codigo" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" required></label><button>Verificar y crear cuenta</button></form></section><p><a href="login.html">Volver al inicio de sesión</a></p></main><script src="assets/js/invitacion.js?v=1"></script></body></html>
