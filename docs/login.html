<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Misión Jardines</title>
    <style>
        :root {
            --primary: #f28c28;
            --primary-dark: #dc7208;
            --primary-soft: #fff4e7;
            --success: #24a56a;
            --success-soft: #eaf9f2;
            --danger: #d84f5f;
            --danger-soft: #fff0f2;
            --text: #202536;
            --text-soft: #6f7689;
            --border: #e3e6ee;
            --surface: rgba(255, 255, 255, .94);
            --shadow: 0 30px 90px rgba(39, 45, 68, .14), 0 10px 30px rgba(39, 45, 68, .08);
            --radius-xl: 30px;
            --radius-md: 13px
        }

        * {
            box-sizing: border-box
        }

        html {
            min-height: 100%
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--text);
            background: radial-gradient(circle at 78% 13%, rgba(242, 140, 40, .14), transparent 28%), radial-gradient(circle at 8% 88%, rgba(15, 151, 186, .1), transparent 28%), linear-gradient(145deg, #fafbfe, #f2f5fb);
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif
        }

        button,
        input {
            font: inherit
        }

        .login-page {
            width: min(1180px, calc(100% - 40px));
            min-height: 680px;
            display: grid;
            grid-template-columns: 1.08fr .92fr;
            overflow: hidden;
            border: 1px solid rgba(222, 225, 235, .94);
            border-radius: var(--radius-xl);
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px)
        }

        .login-showcase {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 680px;
            padding: 50px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, .98), rgba(255, 247, 237, .97))
        }

        .login-showcase:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(242, 140, 40, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(242, 140, 40, .045) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none
        }

        .showcase-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(28px);
            pointer-events: none
        }

        .showcase-glow-one {
            top: -90px;
            right: -70px;
            width: 310px;
            height: 310px;
            background: rgba(242, 140, 40, .18)
        }

        .showcase-glow-two {
            bottom: -100px;
            left: -60px;
            width: 300px;
            height: 300px;
            background: rgba(15, 151, 186, .12)
        }

        .brand,
        .showcase-content,
        .showcase-footer {
            position: relative;
            z-index: 2
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .brand-logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid #f3dcc3;
            border-radius: 17px;
            background: #fff7ed;
            box-shadow: 0 8px 22px rgba(145, 79, 15, .09)
        }

        .brand-logo img {
            width: 82%;
            height: 82%;
            object-fit: contain
        }

        .brand-copy strong {
            display: block;
            font-size: 18px;
            letter-spacing: -.3px
        }

        .brand-copy span {
            display: block;
            margin-top: 2px;
            color: var(--text-soft);
            font-size: 12px
        }

        .showcase-content {
            max-width: 560px;
            margin: 54px 0 40px
        }

        .showcase-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 8px 12px;
            border: 1px solid #f1d3ae;
            border-radius: 999px;
            color: #bc650c;
            background: rgba(255, 245, 232, .9);
            font-size: 11px;
            font-weight: 800
        }

        .showcase-content h1 {
            max-width: 560px;
            margin: 0 0 20px;
            color: #202536;
            font-size: clamp(42px, 5vw, 66px);
            line-height: 1.02;
            letter-spacing: -2.5px
        }

        .showcase-content h1 span {
            color: var(--primary)
        }

        .showcase-content>p {
            max-width: 520px;
            margin: 0;
            color: var(--text-soft);
            font-size: 16px;
            line-height: 1.7
        }

        .showcase-dashboard {
            position: relative;
            margin-top: 34px;
            padding: 18px;
            border: 1px solid rgba(230, 222, 211, .92);
            border-radius: 22px;
            background: rgba(255, 255, 255, .82);
            box-shadow: 0 18px 50px rgba(55, 60, 82, .11);
            backdrop-filter: blur(14px)
        }

        .showcase-dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 15px
        }

        .showcase-dashboard-header strong {
            font-size: 13px
        }

        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border: 1px solid #ccebdc;
            border-radius: 999px;
            color: #187b52;
            background: var(--success-soft);
            font-size: 9px;
            font-weight: 900
        }

        .system-status:before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(36, 165, 106, .1)
        }

        .showcase-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .showcase-metric {
            padding: 13px;
            border: 1px solid #e9eaf0;
            border-radius: 14px;
            background: rgba(255, 255, 255, .94)
        }

        .showcase-metric small {
            display: block;
            color: #8d93a3;
            font-size: 9px;
            font-weight: 700
        }

        .showcase-metric strong {
            display: block;
            margin-top: 4px;
            color: #2c3142;
            font-size: 22px
        }

        .showcase-metric span {
            display: block;
            margin-top: 2px;
            color: #36966e;
            font-size: 8px
        }

        .showcase-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 26px
        }

        .showcase-feature {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .feature-check {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 7px 15px rgba(242, 140, 40, .22)
        }

        .showcase-feature strong {
            display: block;
            font-size: 11px
        }

        .showcase-feature small {
            display: block;
            margin-top: 1px;
            color: var(--text-soft);
            font-size: 9px
        }

        .login-form-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            border-left: 1px solid var(--border);
            background: rgba(255, 255, 255, .96)
        }

        .login-card {
            width: min(100%, 410px)
        }

        .login-heading {
            margin-bottom: 30px
        }

        .login-heading small {
            display: block;
            margin-bottom: 7px;
            color: var(--primary-dark);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .65px;
            text-transform: uppercase
        }

        .login-heading h2 {
            margin: 0 0 10px;
            color: #252a3c;
            font-size: 32px;
            letter-spacing: -1px
        }

        .login-heading p {
            margin: 0;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.6
        }

        .form-group {
            margin-bottom: 18px
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555c6f;
            font-size: 11px;
            font-weight: 800
        }

        .input-wrapper {
            position: relative
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: #9aa0af;
            pointer-events: none;
            font-size: 15px
        }

        .form-input {
            width: 100%;
            min-height: 50px;
            padding: 12px 46px 12px 43px;
            border: 1px solid #dfe3ec;
            border-radius: var(--radius-md);
            color: var(--text);
            background: #fff;
            outline: none;
            font-size: 13px;
            transition: border-color .2s, box-shadow .2s, background .2s
        }

        .form-input::placeholder {
            color: #a5aab7
        }

        .form-input:focus {
            border-color: #efa85f;
            background: #fffefa;
            box-shadow: 0 0 0 4px rgba(242, 140, 40, .11)
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 9px;
            color: #7f8596;
            background: transparent;
            cursor: pointer
        }

        .password-toggle:hover {
            background: #f5f6f9
        }

        .form-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: -2px 0 22px
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6c7385;
            font-size: 10px;
            cursor: pointer
        }

        .remember-option input {
            accent-color: var(--primary)
        }

        .forgot-link {
            color: var(--primary-dark);
            font-size: 10px;
            font-weight: 800;
            text-decoration: none
        }

        .forgot-link:hover {
            text-decoration: underline
        }

        .login-button {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: var(--radius-md);
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 12px 25px rgba(220, 114, 8, .2);
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            transition: transform .18s, box-shadow .18s, filter .18s
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 15px 30px rgba(220, 114, 8, .25)
        }

        .login-button:disabled {
            opacity: .72;
            cursor: wait
        }

        .button-spinner {
            width: 16px;
            height: 16px;
            display: none;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .75s linear infinite
        }

        .login-button.loading .button-spinner {
            display: block
        }

        .login-button.loading .button-icon {
            display: none
        }

        .login-message {
            display: none;
            grid-template-columns: 34px 1fr;
            gap: 11px;
            align-items: flex-start;
            margin-top: 18px;
            padding: 13px;
            border: 1px solid transparent;
            border-radius: 13px
        }

        .login-message.visible {
            display: grid;
            animation: messageIn .22s ease-out
        }

        .login-message.success {
            border-color: #c8ead9;
            background: var(--success-soft)
        }

        .login-message.error {
            border-color: #ffd0d6;
            background: var(--danger-soft)
        }

        .message-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 900
        }

        .success .message-icon {
            background: var(--success)
        }

        .error .message-icon {
            background: var(--danger)
        }

        .message-content strong {
            display: block;
            font-size: 11px
        }

        .success .message-content strong {
            color: #187b52
        }

        .error .message-content strong {
            color: #b33b4a
        }

        .message-content p {
            margin: 3px 0 0;
            color: #6f7689;
            font-size: 10px;
            line-height: 1.45
        }

        .session-preview {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border: 1px solid #dfe8f4;
            border-radius: 13px;
            background: #f7faff
        }

        .session-preview.visible {
            display: block;
            animation: messageIn .22s ease-out
        }

        .session-preview small {
            display: block;
            margin-bottom: 7px;
            color: #7f8799;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase
        }

        .session-user {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .session-avatar {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            font-size: 13px;
            font-weight: 900
        }

        .session-user strong {
            display: block;
            color: #33394b;
            font-size: 11px
        }

        .session-user span {
            display: block;
            margin-top: 2px;
            color: #858b9b;
            font-size: 9px
        }

        .login-security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 22px;
            color: #969baa;
            font-size: 9px;
            text-align: center
        }

        .login-security span {
            color: var(--success)
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(-4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media(max-width:980px) {
            body {
                padding: 24px 0
            }

            .login-page {
                grid-template-columns: 1fr
            }

            .login-showcase {
                min-height: auto;
                padding: 34px
            }

            .showcase-content {
                margin: 48px 0 30px
            }

            .login-form-section {
                padding: 42px 28px;
                border-top: 1px solid var(--border);
                border-left: 0
            }
        }

        @media(max-width:600px) {
            body {
                display: block;
                padding: 0;
                background: #fff
            }

            .login-page {
                width: 100%;
                min-height: 100vh;
                border: 0;
                border-radius: 0;
                box-shadow: none
            }

            .login-showcase {
                display: none
            }

            .login-form-section {
                min-height: 100vh;
                padding: 30px 22px;
                border: 0
            }

            .login-card {
                width: 100%
            }

            .login-heading h2 {
                font-size: 30px
            }
        }
    </style>
</head>

<body>
    <main class="login-page">
        <section class="login-form-section">
            <div class="login-card">
                <div class="login-heading"><small>Acceso al portal</small>
                    <h2>Iniciar sesión</h2>
                    <p>Escribe el correo y la contraseña registrados por la administración.</p>
                </div>
                <form id="loginForm" novalidate>
                    <div class="form-group"><label class="form-label" for="correo">Correo electrónico</label>
                        <div class="input-wrapper"><span class="input-icon">✉</span><input class="form-input"
                                id="correo" name="correo" type="email" placeholder="nombre@correo.com"
                                autocomplete="email" required /></div>
                    </div>
                    <div class="form-group"><label class="form-label" for="contrasena">Contraseña</label>
                        <div class="input-wrapper"><span class="input-icon">🔒</span><input class="form-input"
                                id="contrasena" name="contrasena" type="password" placeholder="Escribe tu contraseña"
                                autocomplete="current-password" required /><button class="password-toggle"
                                id="passwordToggle" type="button" aria-label="Mostrar contraseña">👁</button></div>
                    </div>
                    <div class="form-meta"><label class="remember-option"><input id="recordarme"
                                type="checkbox" />Mantener sesión iniciada</label><a class="forgot-link" href="#"
                            onclick="return false;">¿Olvidaste tu contraseña?</a></div>
                    <button class="login-button" id="loginButton" type="submit"><span
                            class="button-spinner"></span><span class="button-icon">→</span><span
                            id="buttonText">Ingresar al portal</span></button>
                    <div class="login-message" id="loginMessage" role="alert" aria-live="polite"><span
                            class="message-icon" id="messageIcon"></span>
                        <div class="message-content"><strong id="messageTitle"></strong>
                            <p id="messageText"></p>
                        </div>
                    </div>
                    <div class="session-preview" id="sessionPreview"><small>Sesión autenticada correctamente</small>
                        <div class="session-user"><span class="session-avatar" id="sessionAvatar">MJ</span>
                            <div><strong id="sessionName"></strong><span id="sessionDetails"></span></div>
                        </div>
                    </div>
                </form>
                <div class="login-security"><span>●</span>Conexión protegida con autenticación segura</div>
            </div>
        </section>
    </main>
    <script>
        const API_URL =
            location.hostname === 'localhost' ||
                location.hostname === '127.0.0.1'
                ? 'http://localhost:3000/api'
                : 'https://TU-API-DE-HOSTINGER/api';
        const loginForm = document.getElementById("loginForm"), correoInput = document.getElementById("correo"), contrasenaInput = document.getElementById("contrasena"), passwordToggle = document.getElementById("passwordToggle"), loginButton = document.getElementById("loginButton"), buttonText = document.getElementById("buttonText"), loginMessage = document.getElementById("loginMessage"), messageIcon = document.getElementById("messageIcon"), messageTitle = document.getElementById("messageTitle"), messageText = document.getElementById("messageText"), sessionPreview = document.getElementById("sessionPreview"), sessionAvatar = document.getElementById("sessionAvatar"), sessionName = document.getElementById("sessionName"), sessionDetails = document.getElementById("sessionDetails");
        passwordToggle.addEventListener("click", () => { const mostrando = contrasenaInput.type === "text"; contrasenaInput.type = mostrando ? "password" : "text"; passwordToggle.textContent = mostrando ? "👁" : "🙈"; passwordToggle.setAttribute("aria-label", mostrando ? "Mostrar contraseña" : "Ocultar contraseña") });
        function mostrarMensaje(tipo, titulo, texto) { loginMessage.className = `login-message visible ${tipo}`; messageIcon.textContent = tipo === "success" ? "✓" : "!"; messageTitle.textContent = titulo; messageText.textContent = texto }
        function limpiarMensaje() { loginMessage.className = "login-message"; sessionPreview.classList.remove("visible") }
        function activarCarga() { loginButton.disabled = true; loginButton.classList.add("loading"); buttonText.textContent = "Verificando acceso..." }
        function detenerCarga() { loginButton.disabled = false; loginButton.classList.remove("loading"); buttonText.textContent = "Ingresar al portal" }
        function obtenerIniciales(usuario) { const nombre = usuario?.nombre?.trim() || "", apellido = usuario?.apellidoPaterno?.trim() || ""; return `${nombre.charAt(0)}${apellido.charAt(0)}`.toUpperCase() || "MJ" }
        loginForm.addEventListener("submit", async event => {
            event.preventDefault(); limpiarMensaje(); const correo = correoInput.value.trim().toLowerCase(), contrasena = contrasenaInput.value; if (!correo || !contrasena) { mostrarMensaje("error", "Faltan datos", "Escribe tu correo y contraseña para continuar."); return } activarCarga(); try {
                const response = await fetch(`${API_URL}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ correo, contrasena }) }); const result = await response.json(); if (!response.ok || !result.ok) throw new Error(result.message || "No fue posible iniciar sesión."); const storage = document.getElementById("recordarme").checked ? localStorage : sessionStorage; storage.setItem("misionJardinesToken", result.token); storage.setItem("misionJardinesUsuario", JSON.stringify(result.usuario)); mostrarMensaje("success", "Inicio de sesión correcto", "Tus credenciales fueron validadas y el token JWT se guardó correctamente."); const usuario = result.usuario, nombreCompleto = [usuario.nombre, usuario.apellidoPaterno].filter(Boolean).join(" "); sessionAvatar.textContent = obtenerIniciales(usuario); sessionName.textContent = nombreCompleto || usuario.correo; sessionDetails.textContent = `${usuario.rol?.nombre || "Usuario"} · ${usuario.casa?.codigoCasa || "Sin casa"}`; sessionPreview.classList.add("visible"); buttonText.textContent = "Acceso autorizado";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1200);
            } catch (error) { mostrarMensaje("error", "No se pudo iniciar sesión", error.message) } finally { detenerCarga() }
        });
    </script>
</body>

</html>
