[conmutador-caseta-entrada]
exten => s,1,Set(GROUP(caseta)=conmutador-caseta)
 same => n,GotoIf($[${GROUP_COUNT(conmutador-caseta@caseta)} > 1]?ocupado)
 same => n,Dial(PJSIP/6001,20,I)
 same => n,Hangup()
 same => n(ocupado),Busy(2)
 same => n,Hangup()

[conmutador-caseta]
exten => s,1,GotoIf($[${REGEX("^[2-9][0-9]{9}$" ${MJ_DESTINO})} = 0]?fin)
 same => n,Dial(PJSIP/${MJ_DESTINO}@6002,30,IL(600000))
 same => n(fin),Hangup()
