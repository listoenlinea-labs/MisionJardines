name: Unify sidebar module

on:
  push:
    paths:
      - '.github/workflows/unify-sidebar-module.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create shared sidebar module and remove duplicated markup
        shell: bash
        run: |
          mkdir -p docs/assets/js

          cat > docs/assets/js/site-sidebar.js <<'EOF'
          (() => {
            const STORAGE_KEY = 'misionJardinesSidebarCollapsed';
            const MOBILE_QUERY = '(max-width: 820px)';

            const icons = {
              home: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10M9 20v-6h6v6"></path></svg>',
              payment: '<svg class="mj-side-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>',
              residents: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
              map: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg>',
              visits: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>',
              reports: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg>',
              calendar: '<svg class="mj-side-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01"></path></svg>',
              directory: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"></path><path d="M8 2v4M16 2v4M8 11h8M8 15h5"></path></svg>',
              shield: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path><path d="M12 8v4M12 16h.01"></path></svg>',
              headset: '<svg class="mj-side-icon" viewBox="0 0 24 24"><path d="M4 14a8 8 0 0 1 16 0M18 19h1a2 2 0 0 0 2-2v-3h-3v5ZM6 19H5a2 2 0 0 1-2-2v-3h3v5ZM18 19c0 2-2 3-6 3"></path></svg>'
            };

            const menuGroups = [
              {
                label: '',
                items: [
                  { page: 'index.html', label: 'Inicio', icon: 'home' }
                ]
              },
              {
                label: 'Comunidad',
                items: [
                  { page: 'cuotas.html', label: 'Cuotas', icon: 'payment', roles: 'SUPER_ADMIN,ADMINISTRADOR,MESA_DIRECTIVA,CONDOMINO' },
                  { page: 'bases_datos.html', label: 'Residentes', icon: 'residents', roles: 'SUPER_ADMIN,ADMINISTRADOR,MESA_DIRECTIVA,CONDOMINO' },
                  { page: 'mapa.html', label: 'Mapa', icon: 'map', roles: 'SUPER_ADMIN,ADMINISTRADOR,SEGURIDAD,CONDOMINO' },
                  { page: 'visitas.html', label: 'Visitas', icon: 'visits', roles: 'SUPER_ADMIN,ADMINISTRADOR,SEGURIDAD,CONDOMINO' },
                  { page: 'reportes.html', label: 'Reportes', icon: 'reports', roles: 'SUPER_ADMIN,ADMINISTRADOR,MANTENIMIENTO,SEGURIDAD,CONDOMINO' },
                  { page: 'calendario.html', label: 'Calendario', icon: 'calendar', roles: 'SUPER_ADMIN,ADMINISTRADOR,MESA_DIRECTIVA,MANTENIMIENTO,CONDOMINO' },
                  { page: 'directorio.html', label: 'Directorio', icon: 'directory', roles: 'SUPER_ADMIN,ADMINISTRADOR,MESA_DIRECTIVA,SEGURIDAD,MANTENIMIENTO,CONDOMINO' }
                ]
              },
              {
                label: 'Administración',
                items: [
                  { page: 'seguridad.html', label: 'Seguridad', icon: 'shield', roles: 'SUPER_ADMIN,ADMINISTRADOR,SEGURIDAD' }
                ]
              }
            ];

            function currentPage() {
              const name = location.pathname.split('/').pop();
              return name || 'index.html';
            }

            function getCachedRole() {
              for (const storage of [localStorage, sessionStorage]) {
                try {
                  const raw = storage.getItem('misionJardinesUsuario');
                  if (!raw) continue;
                  const user = JSON.parse(raw);
                  return user?.rol?.nombre || user?.rol || '';
                } catch (_) {}
              }
              return '';
            }

            function applyPermissions(root) {
              const role = getCachedRole();
              if (!role) return;

              root.querySelectorAll('[data-roles]').forEach((element) => {
                const allowed = element.dataset.roles.split(',').map((item) => item.trim());
                element.hidden = !allowed.includes(role);
              });
            }

            function createMenuMarkup() {
              const activePage = currentPage();
              const groups = menuGroups.map((group) => {
                const links = group.items.map((item) => {
                  const active = item.page === activePage ? ' active' : '';
                  const roles = item.roles ? ` data-roles="${item.roles}"` : '';
                  return `<a class="mj-side-link${active}" href="${item.page}"${roles}>${icons[item.icon]}<span>${item.label}</span></a>`;
                }).join('');

                return `<div class="mj-side-group">${group.label ? `<div class="mj-side-label">${group.label}</div>` : ''}${links}</div>`;
              }).join('');

              return `
                <div class="mj-side-inner">
                  <div class="mj-side-logo"><img src="assets/images/logo-mision-jardines.png" alt="Misión Jardines"></div>
                  <div class="mj-side-community"><strong>Misión Jardines</strong><span>Zapopan, Jalisco</span></div>
                  <nav class="mj-side-nav" aria-label="Navegación principal">${groups}</nav>
                  <div class="mj-side-support">
                    <div class="mj-side-support-head">${icons.headset}<span>¿Necesitas ayuda?</span></div>
                    <p>Soporte disponible<br>Lun - Vie 9:00 - 18:00</p>
                    <a href="mailto:soluciones@listoenlinea.com">Contactar soporte</a>
                  </div>
                </div>
              `;
            }

            function injectStyles() {
              if (document.getElementById('mjSharedSidebarStyles')) return;
              const style = document.createElement('style');
              style.id = 'mjSharedSidebarStyles';
              style.textContent = `
                :root {
                  --mj-side-width: 224px;
                  --mj-side-orange: #f97316;
                  --mj-side-yellow: #facc15;
                  --mj-side-ink: #172033;
                  --mj-side-muted: #69758d;
                  --mj-side-line: #e4e8ef;
                  --mj-side-transition: .24s ease;
                }

                body.mj-shared-sidebar-enabled:not(.mj-home) {
                  padding-left: var(--mj-side-width) !important;
                  transition: padding-left var(--mj-side-transition);
                }

                body.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed:not(.mj-home) {
                  padding-left: 0 !important;
                }

                body.mj-shared-sidebar-enabled:not(.mj-home) > header {
                  display: none !important;
                }

                body.mj-shared-sidebar-enabled .mj-shared-sidebar {
                  width: var(--mj-side-width);
                  height: 100dvh;
                  min-width: 0;
                  z-index: 100;
                  overflow: hidden;
                  border-right: 1px solid var(--mj-side-line);
                  color: var(--mj-side-ink);
                  background: #fff;
                  box-shadow: 8px 0 24px rgba(15,23,42,.05);
                  transition: transform var(--mj-side-transition);
                }

                body.mj-shared-sidebar-enabled:not(.mj-home) .mj-shared-sidebar {
                  position: fixed;
                  inset: 0 auto 0 0;
                }

                body.mj-home.mj-shared-sidebar-enabled .mj-shared-sidebar {
                  position: sticky;
                  top: 0;
                }

                body.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed .mj-shared-sidebar {
                  transform: translateX(-100%);
                }

                body.mj-home.mj-shared-sidebar-enabled .mj-shell {
                  grid-template-columns: var(--mj-side-width) minmax(0,1fr) !important;
                  transition: grid-template-columns var(--mj-side-transition);
                }

                body.mj-home.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed .mj-shell {
                  grid-template-columns: 0 minmax(0,1fr) !important;
                }

                body.mj-home.mj-shared-sidebar-enabled #menuButton {
                  display: none !important;
                }

                .mj-side-inner {
                  width: var(--mj-side-width);
                  height: 100%;
                  display: flex;
                  flex-direction: column;
                  padding: 23px 15px 16px;
                  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }

                .mj-side-logo {
                  height: 67px;
                  display: grid;
                  place-items: center;
                  flex: 0 0 auto;
                }

                .mj-side-logo img {
                  width: 111px;
                  height: 46px;
                  object-fit: contain;
                  filter: none !important;
                }

                .mj-side-community {
                  padding: 15px 13px 14px;
                  border-bottom: 1px solid var(--mj-side-line);
                  flex: 0 0 auto;
                }

                .mj-side-community strong {
                  display: block;
                  color: var(--mj-side-ink);
                  font-size: 15px;
                  line-height: 1.35;
                }

                .mj-side-community span {
                  display: block;
                  margin-top: 2px;
                  color: #8b95a7;
                  font-size: 12px;
                }

                .mj-side-nav {
                  min-height: 0;
                  flex: 1;
                  overflow-y: auto;
                  padding: 15px 0 8px;
                  scrollbar-width: thin;
                }

                .mj-side-group { margin: 0 0 15px; }

                .mj-side-label {
                  padding: 0 13px 7px;
                  color: #8994a8;
                  font-size: 10px;
                  font-weight: 700;
                  letter-spacing: .035em;
                  text-transform: uppercase;
                }

                .mj-side-link {
                  position: relative;
                  height: 35px;
                  display: flex;
                  align-items: center;
                  gap: 13px;
                  margin: 1px 0;
                  padding: 0 13px;
                  border-radius: 7px;
                  color: #5f6b81 !important;
                  background: transparent !important;
                  font-size: 13px !important;
                  font-weight: 500;
                  text-decoration: none;
                  transition: background .16s ease, color .16s ease;
                }

                .mj-side-link:hover {
                  color: var(--mj-side-orange) !important;
                  background: #fff8f2 !important;
                }

                .mj-side-link.active {
                  color: var(--mj-side-orange) !important;
                  font-weight: 700;
                  background: #fff5ec !important;
                }

                .mj-side-link.active::before {
                  content: '';
                  position: absolute;
                  inset: 0 auto 0 -1px;
                  width: 3px;
                  border-radius: 0 3px 3px 0;
                  background: var(--mj-side-orange);
                }

                .mj-side-link[hidden] { display: none !important; }

                .mj-side-icon {
                  width: 18px;
                  height: 18px;
                  flex: 0 0 18px;
                  stroke: currentColor;
                  stroke-width: 1.8;
                  fill: none;
                  stroke-linecap: round;
                  stroke-linejoin: round;
                }

                .mj-side-support {
                  flex: 0 0 auto;
                  margin: 3px 1px 0;
                  padding: 15px 14px 12px;
                  border: 1px solid #f0e8df;
                  border-radius: 13px;
                  color: var(--mj-side-ink);
                  background: linear-gradient(145deg,#fffaf6,#fff);
                  box-shadow: 0 8px 24px rgba(249,115,22,.06);
                  text-align: center;
                }

                .mj-side-support-head {
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                  font-size: 12px;
                  font-weight: 800;
                }

                .mj-side-support-head .mj-side-icon { color: var(--mj-side-orange); }

                .mj-side-support p {
                  margin: 6px 0 9px;
                  color: var(--mj-side-muted);
                  font-size: 10px;
                  line-height: 1.55;
                }

                .mj-side-support > a {
                  height: 29px;
                  display: grid;
                  place-items: center;
                  border-radius: 7px;
                  color: #fff !important;
                  background: var(--mj-side-orange) !important;
                  font-size: 10px;
                  font-weight: 800;
                  text-decoration: none;
                }

                .mj-side-tab {
                  width: 34px;
                  height: 46px;
                  position: fixed;
                  top: 18px;
                  left: var(--mj-side-width);
                  z-index: 130;
                  display: grid;
                  place-items: center;
                  padding: 0;
                  border: 1px solid #e4b600;
                  border-left: 0;
                  border-radius: 0 12px 12px 0;
                  color: #4a3a00;
                  background: linear-gradient(180deg,#fde047,var(--mj-side-yellow));
                  box-shadow: 7px 4px 20px rgba(250,204,21,.24);
                  cursor: pointer;
                  font-family: Inter, ui-sans-serif, sans-serif;
                  font-size: 25px;
                  font-weight: 900;
                  line-height: 1;
                  transition: left var(--mj-side-transition), background .2s ease, transform .2s ease;
                }

                .mj-side-tab:hover {
                  background: linear-gradient(180deg,#fef08a,#fde047);
                  transform: translateX(1px);
                }

                .mj-side-tab:focus-visible {
                  outline: 3px solid rgba(250,204,21,.36);
                  outline-offset: 2px;
                }

                body.mj-shared-sidebar-collapsed .mj-side-tab { left: 0; }

                body.mj-shared-sidebar-enabled:not(.mj-home) > .hero,
                body.mj-shared-sidebar-enabled:not(.mj-home) > .section,
                body.mj-shared-sidebar-enabled:not(.mj-home) > footer {
                  transition: max-width var(--mj-side-transition), width var(--mj-side-transition);
                }

                @media (max-width: 1370px) {
                  :root { --mj-side-width: 212px; }
                }

                @media (max-width: 820px) {
                  :root { --mj-side-width: min(280px, calc(100vw - 55px)); }

                  body.mj-shared-sidebar-enabled:not(.mj-home) { padding-left: 0 !important; }

                  body.mj-home.mj-shared-sidebar-enabled .mj-shell { display: block !important; }

                  body.mj-home.mj-shared-sidebar-enabled .mj-shared-sidebar,
                  body.mj-shared-sidebar-enabled:not(.mj-home) .mj-shared-sidebar {
                    position: fixed;
                    inset: 0 auto 0 0;
                    box-shadow: 20px 0 50px rgba(15,23,42,.18);
                  }

                  body.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed .mj-shared-sidebar {
                    transform: translateX(-100%);
                  }

                  .mj-side-tab {
                    top: 14px;
                    height: 42px;
                  }
                }

                @media (prefers-reduced-motion: reduce) {
                  body.mj-shared-sidebar-enabled,
                  body.mj-shared-sidebar-enabled .mj-shared-sidebar,
                  body.mj-home.mj-shared-sidebar-enabled .mj-shell,
                  .mj-side-tab { transition: none !important; }
                }
              `;
              document.head.appendChild(style);
            }

            function setCollapsed(body, button, collapsed, persist = true) {
              body.classList.toggle('mj-shared-sidebar-collapsed', collapsed);
              button.textContent = collapsed ? '›' : '‹';
              button.setAttribute('aria-expanded', String(!collapsed));
              button.setAttribute('aria-label', collapsed ? 'Mostrar menú lateral' : 'Ocultar menú lateral');

              if (persist) {
                try { localStorage.setItem(STORAGE_KEY, collapsed ? '1' : '0'); } catch (_) {}
              }
            }

            function init() {
              const body = document.body;
              if (!body || body.dataset.sharedSidebarReady === 'true') return;
              body.dataset.sharedSidebarReady = 'true';
              body.classList.add('mj-shared-sidebar-enabled');
              injectStyles();

              let sidebar = document.getElementById('sidebar');
              const isHome = body.classList.contains('mj-home');

              if (!isHome) {
                const legacyHeader = document.querySelector('body > header');
                if (legacyHeader) legacyHeader.remove();

                sidebar = document.createElement('aside');
                sidebar.id = 'sidebar';
                sidebar.className = 'mj-shared-sidebar';
                sidebar.setAttribute('aria-label', 'Navegación principal');
                body.insertBefore(sidebar, body.firstChild);
              } else if (sidebar) {
                sidebar.classList.add('mj-shared-sidebar');
              }

              if (!sidebar) return;
              sidebar.innerHTML = createMenuMarkup();
              applyPermissions(sidebar);

              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'mj-side-tab';
              button.title = 'Ocultar / mostrar menú';
              button.setAttribute('aria-controls', 'sidebar');
              document.body.appendChild(button);

              let stored = null;
              try { stored = localStorage.getItem(STORAGE_KEY); } catch (_) {}

              let collapsed = stored === '1';
              if (stored !== '1' && stored !== '0' && window.matchMedia(MOBILE_QUERY).matches) collapsed = true;

              button.addEventListener('click', () => {
                setCollapsed(body, button, !body.classList.contains('mj-shared-sidebar-collapsed'));
              });

              sidebar.addEventListener('click', (event) => {
                if (window.matchMedia(MOBILE_QUERY).matches && event.target.closest('a')) {
                  setCollapsed(body, button, true);
                }
              });

              document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && window.matchMedia(MOBILE_QUERY).matches && !body.classList.contains('mj-shared-sidebar-collapsed')) {
                  setCollapsed(body, button, true);
                  button.focus();
                }
              });

              setCollapsed(body, button, collapsed, false);
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once: true });
            } else {
              init();
            }
          })();
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          legacy_pages = [
              'docs/cuotas.html',
              'docs/bases_datos.html',
              'docs/mapa.html',
              'docs/visitas.html',
              'docs/seguridad.html',
              'docs/calendario.html',
              'docs/reportes.html',
              'docs/directorio.html',
          ]

          marker = '<script src="assets/js/site-sidebar.js?v=1"></script>'

          for filename in legacy_pages:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              # Remove the duplicated legacy navigation header. The shared module now owns it.
              text, count = re.subn(
                  r'\n\s*<header>\s*<nav>.*?</nav>\s*</header>\s*',
                  '\n',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f'No se pudo localizar el header principal en {filename}')

              text = re.sub(
                  r'\s*<script src="assets/js/brand-collapse\.js\?v=\d+"></script>',
                  '',
                  text,
              )
              text = re.sub(
                  r'\s*<script src="assets/js/site-sidebar\.js\?v=\d+"></script>',
                  '',
                  text,
              )

              if '</body>' not in text:
                  raise RuntimeError(f'No se encontró </body> en {filename}')
              text = text.rsplit('</body>', 1)[0] + f'  {marker}\n</body>' + text.rsplit('</body>', 1)[1]
              path.write_text(text, encoding='utf-8')

          index = Path('docs/index.html')
          text = index.read_text(encoding='utf-8')
          text, count = re.subn(
              r'<aside class="mj-sidebar" id="sidebar" aria-label="Navegación principal">.*?</aside>',
              '<aside class="mj-sidebar" id="sidebar" aria-label="Navegación principal"></aside>',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('No se pudo localizar el sidebar de index.html')

          text = re.sub(
              r'\s*<script src="assets/js/site-sidebar\.js\?v=\d+"></script>',
              '',
              text,
          )
          text = text.rsplit('</body>', 1)[0] + f'  {marker}\n</body>' + text.rsplit('</body>', 1)[1]
          index.write_text(text, encoding='utf-8')

          old = Path('docs/assets/js/brand-collapse.js')
          if old.exists(): old.unlink()
          PY

          rm -f .github/workflows/unify-sidebar-module.yml

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs .github/workflows/unify-sidebar-module.yml
          git commit -m "Unificar menu lateral en modulo compartido"
          git push
