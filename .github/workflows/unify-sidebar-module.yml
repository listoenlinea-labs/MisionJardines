name: Unify sidebar module

on:
  push:
    paths:
      - 'scripts/unify-sidebar-module.sh'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared sidebar module
        run: bash scripts/unify-sidebar-module.sh

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts .github/workflows/unify-sidebar-module.yml
          git commit -m "Unificar menu lateral en modulo compartido"
          git push
