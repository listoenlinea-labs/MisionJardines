name: Verificar finanzas
on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/analisis-cuotas.html"
      - "docs/assets/js/analisis-cuotas.js"
      - "docs/assets/css/analisis-cuotas.css"
      - "docs/pagos.html"
      - "docs/assets/js/pagos.js"
      - ".github/workflows/verificar-finanzas.yml"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JS frontend y backend
        run: |
          node --check docs/assets/js/pagos.js
          node --check docs/assets/js/analisis-cuotas.js
          node --check backend/src/controllers/finanzas.controller.js
          node --check backend/src/controllers/seguridad-cuotas.controller.js
          node --check backend/src/services/estado-mantenimiento-tablas.service.js
          node --check backend/src/controllers/pagos.controller.js
          node --check backend/src/controllers/pagos-manuales-analisis.controller.js
          node --check backend/src/services/adeudo-vivienda-analisis.service.js
          node --check backend/src/services/cuotas-mantenimiento-calculo.js
          node --check backend/src/services/pago-manual-analisis.service.js
          node --check backend/src/services/recargos-exenciones.service.js
      - name: Instalar dependencias del backend sin ejecutar scripts de despliegue
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Banco: relación parcial no bloquea coincidencia completa; ZKTeco TCP
        run: |
          node --check backend/src/services/banco-diagnostico.service.js
          node --check backend/src/services/banco-correo-worker.service.js
          node --check backend/src/services/zkteco-direct.service.js
          node --check backend/src/controllers/zkteco.controller.js
          node --test backend/test/banco-coincidencia-unica-tcp-20261111.test.js backend/tests/banco-diagnostico-timeline.test.js backend/tests/diagnostico-cotejo-por-campo.test.js backend/test/correo-solo-remitente.test.js

      - name: Casa Club histórico, proyectos parciales, folios y contraseña
        run: |
          node --check backend/src/models/RecuperacionContrasena.js
          node --check backend/src/controllers/recuperacion-contrasena.controller.js
          node --check backend/src/services/folio-recibo-mj.service.js
          node --check backend/src/controllers/casa-club.controller.js
          node --check backend/src/controllers/pagos.controller.js
          node --check backend/src/services/pago-reportado-pdf.service.js
          node --check backend/src/services/email.service.js
          node --check backend/src/routes/auth.routes.js
          node --check backend/src/routes/casa-club.routes.js
          node --check docs/assets/js/casa-club.js
          node --check docs/assets/js/pagos.js
          node --test backend/test/casa-club-import-extra-reset-folios-20261111.test.js
          node --test backend/test/casa-club-autoaprobacion-titan-20261111.test.js
          node --test backend/test/proyectos-extraordinarios-reglas.test.js

      - name: Casa Club confirma automáticamente con Titan y conserva comprobantes
        run: |
          node --check backend/src/services/casa-club-pago-automatico.service.js
          node --check backend/src/services/casa-club-avisos.service.js
          node --check backend/src/services/adeudos-comunidad.service.js
          node --check backend/src/controllers/pagos.controller.js
          node --check backend/src/controllers/casa-club.controller.js
          node --check docs/assets/js/casa-club.js
          node --check docs/assets/js/pagos.js
          node --test backend/test/casa-club-autoaprobacion-titan-20261111.test.js backend/test/casa-club-publico.test.js backend/test/casa-club.test.js backend/test/casa-club-tarifas-liberacion-20261111.test.js
          node --test backend/test/banco-coincidencia-unica-tcp-20261111.test.js backend/test/validacion-pagos-correo.test.js

      - name: Titan IMAP mensajes largos sin bloquear la conciliación bancaria
        run: |
          node --check backend/src/services/correo-imap.transport.js
          node --check backend/src/services/correo-bancario-mail.service.js
          node --test backend/test/imap-mensajes-grandes.test.js backend/test/diagnostico-buzon-pagos.test.js

      - name: Condóminos, tarifas Casa Club, cancelaciones, OCR, correo y C3
        run: |
          node --check docs/assets/js/casa-club.js
          node --check backend/src/controllers/casa-club.controller.js
          node --check backend/src/services/casa-club-tarifas.service.js
          node --check backend/src/services/casa-club-avisos.service.js
          node --check backend/src/middlewares/auth.middleware.js
          node --test backend/test/permissions.test.js backend/test/auth-permissions.test.js backend/test/mobile-condomino-padron-20261111.test.js
          node --test backend/test/casa-club.test.js backend/test/casa-club-publico.test.js backend/test/casa-club-tarifas-liberacion-20261111.test.js
          node --test backend/test/validacion-pagos-correo.test.js backend/test/pagos-acceso-c3.test.js backend/test/zkteco-vigencias.test.js
      - name: TEST-001 visible únicamente para pruebas sin alterar indicadores ni proyectos
        run: |
          node --check backend/src/controllers/finanzas.controller.js
          node --check backend/src/controllers/zkteco.controller.js
          node --check backend/src/services/zkteco-direct.service.js
          node --check docs/assets/js/analisis-cuotas.js
          node --check docs/assets/js/zkteco-address-filter.js
          node --test backend/test/test001-solo-analisis-zkteco-20261111.test.js backend/test/padron-finanzas.test.js backend/test/viviendas-visibles.test.js backend/test/zkteco-address-filter.test.js backend/test/analisis-seleccion-proyectos.test.js

      - name: Cuotas extraordinarias de $0 y distribución exacta del presupuesto
        run: |
          node --check docs/assets/js/proyectos-presupuesto.js
          node --check backend/src/services/proyectos-presupuesto.service.js
          node --check backend/src/services/proyectos-extraordinarios.service.js
          node --check backend/src/services/proyectos-extraordinarios-validacion.service.js
          node --check backend/src/services/proyectos-cuotas-version.service.js
          node --test backend/test/proyectos-presupuesto.test.js backend/test/proyectos-cuotas-version.test.js backend/test/proyectos-cero-edicion.test.js
          node --test --test-name-pattern='la tarifa especial .0 reduce meta' backend/test/proyectos-extraordinarios-reglas.test.js
      - name: Resaltado de fila seleccionada en mantenimiento y proyectos
        run: node --test backend/test/analisis-seleccion-proyectos.test.js
      - name: Excel de proyectos, recibos por correo, retorno y sincronización
        run: |
          node --check docs/assets/js/analisis-excel-proyectos.js
          node --check docs/assets/js/analisis-excel.js
          node --check backend/src/services/recibos-correo-analisis.service.js
          node --check backend/src/services/finanzas-live-signal.service.js
          node --test backend/test/finanzas-proyectos-correo-live.test.js
      - name: SMTP Gmail independiente sin afectar el correo de Listo en Línea
        run: |
          node --check backend/src/services/email.service.js
          node --test backend/test/mj-gmail-smtp-aislado.test.js
      - name: Saldo cero en proyectos, tarjetas largas y correo editable
        run: |
          node --test backend/test/proyectos-pendientes-correo-editable.test.js
          node --test backend/test/finanzas-proyectos-correo-live.test.js
      - name: Correo de mantenimiento y proyectos: proyectoId definido
        run: node --test backend/test/recibos-correo-proyecto-id.test.js
      - name: Rosas 10: intento C3 anulado no bloquea cobro de noviembre
        run: node --test backend/test/pagos-c3-anulados-no-bloquean.test.js
      - name: Contactos de recibos guardados y mensaje central de email
        run: |
          node --check backend/src/services/contacto-recibos-analisis.service.js
          node --check backend/src/controllers/contacto-recibos-analisis.controller.js
          node --test backend/test/recibos-contactos-guardados.test.js
      - name: Diagnóstico seguro de conexión C3-200
        run: |
          node --check backend/src/services/zkteco-diagnostico-conexion.service.js
          node --check backend/src/controllers/zkteco.controller.js
          node --test backend/test/zkteco-diagnostico-conexion.test.js
      - name: Resiliencia C3 y búsqueda unificada de viviendas
        run: |
          node --check backend/src/services/zkteco-autosync.service.js
          node --check backend/src/services/zkteco-c3-client.service.js
          node --check docs/assets/js/zkteco-address-filter.js
          node --test backend/test/zkteco-address-filter.test.js backend/test/zkteco-autosync.test.js
      - name: Campo libre Calle y número sin listado desplegable
        run: node --test backend/test/zkteco-calle-libre.test.js
      - name: Reintentos de comprobantes fallidos sin doble acreditación
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: mision_test_ci
          DB_USER: ci_test
          DB_PASSWORD: ci_only_no_connection
        run: node --test backend/test/pagos-reintento-validacion.test.js backend/test/pagos-relectura-ocr.test.js
      - name: Abonos parciales a recargos antes del mantenimiento
        run: node --test --test-name-pattern="Cualquier abono positivo|Complementos a varios recargos|20 \+ 30|Reporte acepta abono" backend/test/cuotas-mantenimiento-calculo.test.js backend/test/cuotas-mantenimiento-integracion.test.js backend/test/pagos-cuotas-reporte.test.js
      - name: Reparto de depósito por viviendas (servicio, reporte y UI)
        run: node --test backend/test/pagos-reparto.test.js backend/test/pagos-reparto-reporte.test.js backend/test/pagos-reparto-ui.test.js
      - name: Conciliación bancaria con concepto libre y aviso de uso único
        run: node --test backend/tests/banco-concepto-opcional.test.js backend/test/correo-solo-remitente.test.js backend/tests/banco-diagnostico-timeline.test.js backend/tests/diagnostico-importes-aviso-correlacionado.test.js backend/tests/identificadores-ocr-servidor-pago29.test.js
      - name: Extracción OCR de formatos bancarios y campos ambiguos
        run: node --test backend/test/comprobante-formatos-flexibles.test.js backend/test/comprobante-parser.test.js backend/test/comprobante-ocr-doble-lectura.test.js backend/test/comprobantes-candidatos-bancarios.test.js
      - name: Pruebas financieras y de integración sintética TEST-001
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: mision_test_ci
          DB_USER: ci_test
          DB_PASSWORD: ci_only_no_connection
        run: |
          node --test backend/tests/adeudos-enero-saldo-favor-exencion.test.js backend/tests/pagos-test001-octubre-saldo.test.js backend/tests/test001-cuota-diez-vigencia.test.js backend/tests/pagos-cuenta-oficial-render.test.js backend/tests/padron-test001-visible-temporal.test.js
      - name: Regresión Seguridad / Análisis de cuotas (Atotonilco 752)
        run: |
          node --test backend/test/seguridad-cuotas-consistencia.test.js
          node --test --test-name-pattern="cuotas de seguridad|rutas de seguridad" backend/test/seguridad-sheets-mobile.test.js
      - name: Pruebas UI heredadas de Seguridad (diagnóstico)
        continue-on-error: true
        run: node --test backend/test/seguridad-sheets-mobile.test.js
      - name: Suite bancaria heredada, diagnóstico no bloqueante
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: mision_test_ci
          DB_USER: ci_test
          DB_PASSWORD: ci_only_no_connection
        run: node --test backend/tests/*.test.js
      - name: Comparar la suite heredada contra main (solo diagnóstico)
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: mision_test_ci
          DB_USER: ci_test
          DB_PASSWORD: ci_only_no_connection
        run: |
          git fetch --depth=1 origin main
          git worktree add /tmp/mj-main FETCH_HEAD
          cd /tmp/mj-main
          set +e
          NODE_PATH="$GITHUB_WORKSPACE/backend/node_modules" node --test backend/tests/*.test.js > /tmp/mj-baseline.log 2>&1
          resultado=$?
          grep -E '^(not ok|# tests|# pass|# fail)' /tmp/mj-baseline.log || true
          echo "Resultado de la suite en main (0 si todas pasan): $resultado"
          exit 0
