name: Fix sidebar uniformity

on:
  push:
    paths:
      - '.github/workflows/fix-sidebar-uniformity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make shared sidebar visually identical on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/assets/js/site-sidebar.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
          """      body.mj-shared-sidebar-enabled:not(.mj-home) {
                padding-left: var(--mj-side-width) !important;
                transition: padding-left var(--mj-side-transition);
              }

              body.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed:not(.mj-home) {
                padding-left: 0 !important;
              }

              body.mj-shared-sidebar-enabled:not(.mj-home) > header {
                display: none !important;
              }
""",
          """      body.mj-shared-sidebar-enabled {
                padding-left: var(--mj-side-width) !important;
                transition: padding-left var(--mj-side-transition);
              }

              body.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed {
                padding-left: 0 !important;
              }

              body.mj-shared-sidebar-enabled:not(.mj-home) > header {
                display: none !important;
              }
""")

          text = text.replace(
          """      .mj-shared-sidebar {
                width: var(--mj-side-width);
                height: 100dvh;
                min-width: 0;
                z-index: 100;
                overflow: hidden;
                border-right: 1px solid var(--mj-side-line);
                color: var(--mj-side-ink);
                background: #fff;
                box-shadow: 8px 0 24px rgba(15,23,42,.05);
                transition: transform var(--mj-side-transition);
              }

              body:not(.mj-home) .mj-shared-sidebar {
                position: fixed;
                inset: 0 auto 0 0;
              }

              body.mj-home .mj-shared-sidebar {
                position: sticky;
                top: 0;
              }
""",
          """      .mj-shared-sidebar {
                width: var(--mj-side-width);
                height: 100dvh;
                min-width: 0;
                position: fixed !important;
                inset: 0 auto 0 0 !important;
                z-index: 100;
                overflow: hidden;
                border-right: 1px solid var(--mj-side-line);
                color: var(--mj-side-ink);
                background: #fff;
                box-shadow: 8px 0 24px rgba(15,23,42,.05);
                font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;
                font-size: 16px;
                line-height: 1.2;
                text-align: left;
                transition: transform var(--mj-side-transition);
              }

              .mj-shared-sidebar,
              .mj-shared-sidebar * {
                box-sizing: border-box;
              }
""")

          text = text.replace(
          """      body.mj-home.mj-shared-sidebar-enabled .mj-shell {
                grid-template-columns: var(--mj-side-width) minmax(0,1fr) !important;
                transition: grid-template-columns var(--mj-side-transition);
              }

              body.mj-home.mj-shared-sidebar-enabled.mj-shared-sidebar-collapsed .mj-shell {
                grid-template-columns: 0 minmax(0,1fr) !important;
              }
""",
          """      body.mj-home.mj-shared-sidebar-enabled .mj-shell {
                display: block !important;
                grid-template-columns: none !important;
              }
""")

          text = text.replace(
          """      .mj-side-nav {
                min-height: 0;
                flex: 1;
                overflow-y: auto;
                padding: 15px 0 8px;
                scrollbar-width: thin;
              }
""",
          """      .mj-shared-sidebar .mj-side-nav {
                width: 100% !important;
                max-width: none !important;
                min-height: 0;
                display: block !important;
                flex: 1;
                overflow-y: auto;
                margin: 0 !important;
                padding: 15px 0 8px !important;
                justify-content: initial !important;
                align-items: initial !important;
                gap: 0 !important;
                scrollbar-width: thin;
              }
""")

          text = text.replace(
          """      .mj-side-link {
                position: relative;
                height: 35px;
                display: flex;
                align-items: center;
                gap: 13px;
                margin: 1px 0;
                padding: 0 13px;
                border-radius: 7px;
                color: #5f6b81 !important;
                background: transparent !important;
                font-size: 13px !important;
                font-weight: 500;
                text-decoration: none;
                transition: background .16s ease, color .16s ease;
              }
""",
          """      .mj-shared-sidebar .mj-side-link {
                width: 100% !important;
                height: 35px;
                position: relative;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 13px !important;
                margin: 1px 0 !important;
                padding: 0 13px !important;
                border: 0 !important;
                border-radius: 7px !important;
                color: #5f6b81 !important;
                background: transparent !important;
                box-shadow: none !important;
                font-family: inherit !important;
                font-size: 13px !important;
                font-weight: 500;
                line-height: 1.2 !important;
                text-align: left !important;
                text-decoration: none !important;
                transition: background .16s ease, color .16s ease;
              }
""")

          text = text.replace(
          """        body.mj-shared-sidebar-enabled:not(.mj-home) {
                  padding-left: 0 !important;
                }

                body.mj-home.mj-shared-sidebar-enabled .mj-shell {
                  display: block !important;
                }
""",
          """        body.mj-shared-sidebar-enabled {
                  padding-left: 0 !important;
                }

                body.mj-home.mj-shared-sidebar-enabled .mj-shell {
                  display: block !important;
                }
""")

          text = text.replace(
          """    const shell = document.querySelector('.mj-shell');

              if (shell) {
                shell.insertBefore(sidebar, shell.firstChild);
              } else {
                document.body.insertBefore(sidebar, document.body.firstChild);
              }
""",
          """    document.body.insertBefore(sidebar, document.body.firstChild);
""")

          path.write_text(text, encoding='utf-8')

          for html in Path('docs').glob('*.html'):
              content = html.read_text(encoding='utf-8')
              content = content.replace('assets/js/site-sidebar.js?v=1', 'assets/js/site-sidebar.js?v=2')
              html.write_text(content, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-sidebar-uniformity.yml

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs .github/workflows/fix-sidebar-uniformity.yml
          git commit -m "Igualar menu lateral de inicio con el resto"
          git push
